<!DOCTYPE html>
<html>
    <head>
        {% load static %}
        <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>

    </head>
    <body>
        <!-- Header Start -->
        <div class="container-fluid bg-dark px-0 text-center">
            <span class="m-0 display-4 text-white mx-3 my-3">RealTime Chat APP</span>
        </div>
        <!-- Header End -->

        <section class="vh-100 gradient-custom">
            <div class="container py-5 h-100">
              <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                  <div class="card bg-dark text-white" style="border-radius: 1rem;">
                    <div class="card-body p-5 text-center">
          
                      <div class="mb-md-5 mt-md-4 pb-5">
          
                        <h2 class="fw-bold mb-2 text-uppercase">Login</h2>
                        <p class="text-white-50 mb-5">Please enter your login and password!</p>
                            <form method ="post">
                                {% csrf_token %}
                                {{form.as_p}}
                                <br>
                                <button type = "submit">Login</button>
                            </form>
          
                      </div>
          
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>
    </body>
    <script>
        var button = document.getElementsByTagName("button")[0];
        button.setAttribute("class", "btn btn-primary btn-lg btn-block");
        var email = document.getElementById("id_username");
        email.setAttribute("class", "form-outline form-white mb-4 form-control form-control-lg");
        var password = document.getElementById("id_password");
        password.setAttribute("class", "form-outline form-white mb-4 form-control form-control-lg");
    </script>
</html>
