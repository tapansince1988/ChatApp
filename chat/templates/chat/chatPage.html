<!DOCTYPE html>
<html>
  <body>
    <center><h1>Hello , Welcome to my chat site ! {{request.user}}</h1></center>
    <br>
    {% if request.user.is_authenticated  %}
    <center> Leave the chat site ?  
        <form method="post" action="{% url 'logout-user' %}">
            {% csrf_token %}
            <button type="submit">logout</button>
        </form>
    </center>
    {% endif %}
    <div
      class="chat__item__container"
      id="id_chat_item_container"
      style="font-size: 20px"
    >
      <br />
      <input type="text" id="id_message_send_input" />
      <button type="submit" id="id_message_send_button">Send Message</button>
      <br />
      <br />
    </div>
    <script>
      const chatSocket = new WebSocket("ws://" + window.location.host + "/");
      chatSocket.onopen = function (e) {
        console.log("The connection was setup successfully !");
        {% comment %} chatSocket.send(JSON.stringify({ message: 'Hi, I have logged in.', username : "{{request.user.username}}"})); {% endcomment %}
      };
      chatSocket.onclose = function (e) {
        console.log("Something unexpected happened !");
      };
      document.querySelector("#id_message_send_input").focus();
      document.querySelector("#id_message_send_input").onkeyup = function (e) {
        if (e.keyCode == 13) {
          document.querySelector("#id_message_send_button").click();
        }
      };
      document.querySelector("#id_message_send_button").onclick = function (e) {
        var messageInput = document.querySelector(
          "#id_message_send_input"
        ).value;
        chatSocket.send(JSON.stringify({ message: messageInput, username : "{{request.user.username}}"}));
      };

      {% comment %} document.querySelector(type='submit').onclick = function (e) {
        chatSocket.send(JSON.stringify({ message: 'I am leaving now', username : "{{request.user.username}}"}));
      }; {% endcomment %}

      chatSocket.onmessage = function (e) {
        const data = JSON.parse(e.data);
        const messageType = data.message_type;
        const message = data.message;

        if (messageType === 'video') {
            const videoElement = document.createElement('video');
            videoElement.src = message;
            videoElement.controls = true;
            document.getElementById('chat-log').appendChild(videoElement);
        } 
        else {
          var div = document.createElement("div");
          div.innerHTML = data.username + " : " + data.message;
          document.querySelector("#id_message_send_input").value = "";
          document.querySelector("#id_chat_item_container").appendChild(div);
        }
      };
    </script>
  </body>
</html>
