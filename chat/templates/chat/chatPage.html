<!DOCTYPE html>
<html>
  <head>
    {% load static %}
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Chat Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
  
  </head>
  <body>

    <!-- Header Start -->
    <div class="container-fluid bg-dark px-0">
      <div class="d-flex justify-content-between align-items-center px-5 py-3">
        <div class="m-0 display-6 text-white">
          Hello, Welcome to my chat site! {{ request.user }}
        </div>
        {% if request.user.is_authenticated %}
        <form method="post" action="{% url 'logout-user' %}">
          {% csrf_token %}
          <button class="btn btn-danger px-5" type="submit">Logout</button>
        </form>
        {% endif %}
      </div>
    </div>
    <!-- Header End -->

    <div class="container my-4">
      <div class="row g-4">
        <!-- Chat Message Box (Left Column) -->
        <div class="col-md-6">
          <div class="p-4 border rounded" style="font-size: 20px;">
            <!-- Centered Text Input -->
            <div class="text-center">
              <input type="text" id="id_message_send_input" 
                     class="form-control mb-3 d-inline-block" 
                     placeholder="Type your message..." 
                     style="height: 40px; width: 80%; font-size: 20px;" />
            </div>
            <!-- Centered Send Button -->
            <div class="text-center">
              <button type="submit" id="id_message_send_button" class="btn btn-primary px-4">Send Message</button>
            </div>
          </div>
        </div>
    
        <!-- Video Share Box (Right Column) -->
        <div class="col-md-6">
          <div class="p-4 border rounded text-center" style="font-size: 24px;">
            <input type="file" id="videoInput" accept="video/*" style="display: none;">
            <div class="mb-3">Want to share a video? Click on the button.</div>
            <button id="shareVideoBtn" class="btn btn-secondary">Share Video</button>
          </div>
        </div>
      </div>
    </div>

    <div class="container my-4 p-4 border rounded chat__item__container overflow-auto" id="id_chat_item_container" style="font-size: 20px; height: calc(100vh - 200px);">
      <!-- Chat content will go here -->
    </div>
    <script>
      const chatSocket = new WebSocket("ws://" + window.location.host + "/");

      function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.startsWith(name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
      }
    
      chatSocket.onopen = function (e) {
        console.log("The connection was setup successfully !");
        {% comment %} chatSocket.send(JSON.stringify({ message: 'Hi, I have logged in.', username : "{{request.user.username}}"})); {% endcomment %}
      };
      chatSocket.onclose = function (e) {
        console.log("Something unexpected happened !");
      };
      document.querySelector("#id_message_send_input").focus();
      document.querySelector("#id_message_send_input").onkeyup = function (e) {
        if (e.keyCode == 13) {
          document.querySelector("#id_message_send_button").click();
        }
      };
      document.querySelector("#id_message_send_button").onclick = function (e) {
        var messageInput = document.querySelector(
          "#id_message_send_input"
        ).value;
        chatSocket.send(JSON.stringify({ message: messageInput, username : "{{request.user.username}}"}));
      };

      {% comment %} document.querySelector(type='submit').onclick = function (e) {
        chatSocket.send(JSON.stringify({ message: 'I am leaving now', username : "{{request.user.username}}"}));
      }; {% endcomment %}

      // Handle button click to trigger hidden file input
      document.getElementById('shareVideoBtn').addEventListener('click', function () {
        document.getElementById('videoInput').click();
      });

      // Handle file selection and upload
      document.getElementById('videoInput').addEventListener('change', function (event) {
        const file = event.target.files[0];
        if (file) {
            const formData = new FormData();
            formData.append('video', file);

            // Add the username to the form data
            formData.append('username', "{{request.user.username}}");
            const usr = "{{request.user.username}}";
            console.log(usr);

            fetch('/upload_video/', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': getCookie('csrftoken')  // Make sure this function is defined
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.video_url) {
                    // Send the video URL via WebSocket
                    chatSocket.send(JSON.stringify({
                        'message': data.video_url,
                        'type': 'video',
                        'username' : usr
                    }));
                    document.getElementById('videoInput').value = '';
                } else {
                    alert("Upload failed.");
                }
            })
            .catch(error => {
                console.error('Error uploading video:', error);
                alert("Error uploading video.");
            });
        }
      });

      // Call this after new content is added
      function scrollToBottom() {
        const chatContainer = document.getElementById("id_chat_item_container");
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    
      
      chatSocket.onmessage = function (e) {
        const data = JSON.parse(e.data);
        const messageType = data.message_type;
        const message = data.message;
        if (messageType === 'video') {
          const username = data.username || "Unknown";
          console.log(data);
          console.log("username : " + username);
          var div = document.createElement("div");

          // Create <video> element
          const video = document.createElement('video');
          video.setAttribute('controls', '');
          video.setAttribute('width', '640');
          video.setAttribute('height', '640');
          video.style.display = 'block'; 

          // Create <source> element
          const source = document.createElement('source');
          source.setAttribute('src', message);
          source.setAttribute('type', 'video/mp4');
          source.style.display = 'block'; 

          // Append <source> to <video>
          video.appendChild(source);

          // Add fallback text
          video.appendChild(document.createTextNode('Your browser does not support the video tag.'));

          div.appendChild(video);
          console.log(div)
          document.querySelector("#id_chat_item_container").appendChild(div);
          scrollToBottom();
        }
        else {
          console.log("massage : " + message);
          var div = document.createElement("div");
          div.innerHTML = data.username + " : " + data.message;
          document.querySelector("#id_message_send_input").value = "";
          document.querySelector("#id_chat_item_container").appendChild(div);
          scrollToBottom();
        }
      };
    </script>
  </body>
</html>
